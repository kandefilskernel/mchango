<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu Mchango</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1900px; height: 1000px; background: linear-gradient(160deg, #0a3f2d, #0f5e43 60%, #1d7a55); font-family: "Plus Jakarta Sans", sans-serif; color: #fff; }
  .row { display: flex; justify-content: center; gap: 34px; padding: 70px 40px 0; }
  figure { width: 330px; text-align: center; }
  .phone { height: 715px; border-radius: 42px; background: #0d1116; padding: 11px; box-shadow: 0 30px 60px -25px rgba(0,0,0,.7); }
  .screen { height: 100%; border-radius: 32px; overflow: hidden; background: #f6f7f5; }
  .screen img { width: 100%; display: block; }
  figcaption { margin-top: 22px; font-size: 22px; font-weight: 800; }
  figcaption small { display: block; margin-top: 6px; font-size: 16px; font-weight: 600; opacity: .75; }
  footer { position: absolute; bottom: 26px; width: 100%; text-align: center; font-size: 17px; opacity: .7; }
</style>
</head>
<body>
<div class="row">
  <figure><div class="phone"><div class="screen"><img src="home.png" alt=""></div></div><figcaption>1. Accueil<small>Mon carnet, mes tontines</small></figcaption></figure>
  <figure><div class="phone"><div class="screen"><img src="carnet.png" alt=""></div></div><figcaption>2. Mon carnet<small>Versé, reçu, à venir</small></figcaption></figure>
  <figure><div class="phone"><div class="screen"><img src="cycle.png" alt=""></div></div><figcaption>3. Le tour<small>Qui payer, qui a payé</small></figcaption></figure>
  <figure><div class="phone"><div class="screen"><img src="declare.png" alt=""></div></div><figcaption>4. J'ai payé<small>Moyen, puis coller le SMS</small></figcaption></figure>
  <figure><div class="phone"><div class="screen"><img src="receipt.png" alt=""></div></div><figcaption>5. Le reçu<small>Numéro unique et QR</small></figcaption></figure>
</div>
<footer>Mchango par nuru-k · données d'exemple (noms et numéros fictifs)</footer>
</body>
</html>
